# your projects
projects:
  - name: PredBat
    logo: /images/sections/projects/predbat.png
    role: Co-founder & CTO
    timeline: "Feb 2025 - Present"
    summary: Home battery optimisation platform for UK households, spanning cloud, hardware and mobile, serving 280+ paying subscribers in production.
    tags: ["professional"]
    description: |
      PredBat forecasts household solar generation and demand, reads live half-hourly tariffs, and drives the
      customer's inverter to charge and discharge at the cheapest possible times. It spans the full stack:
      custom gateway hardware talking Modbus to the inverter, a multi-tenant Kubernetes cloud, and native
      mobile apps.

      **Platform & Infrastructure:**
      - Multi-tenant Kubernetes on Hetzner with per-customer namespace isolation and automated provisioning
      - Flux GitOps with Kustomize overlays, templated per-customer manifests, and SOPS/age encrypted secrets
      - Terraform-managed clusters; progressive multi-wave rollouts for safe feature deployment
      - Cluster access behind a Cloudflare Zero Trust tunnel, with K3s OIDC gating admin on GitHub org membership
      - Customer lifecycle automation covering onboarding, pause/resume and deletion

      **Hardware & Firmware:**
      - PredBat Gateway, a custom ESP32-S3 USB dongle speaking Modbus RTU directly to the inverter, designed
        from schematic capture through contract fabrication
      - Over-the-air firmware update pipeline and Bluetooth LE provisioning for out-of-the-box setup
      - Static-analysis toolchain that recovers inverter register maps and scaling factors from firmware images,
        reporting each fact with a confidence score

      **Data & Integrations:**
      - Device telemetry over MQTT into VictoriaMetrics, with Grafana dashboards, alerting and status pages
      - UK energy suppliers: Octopus, EDF, E.ON and others, including OAuth and token refresh handling
      - Inverter and EV charger vendors: GivEnergy, Fox ESS, Solis, SolaX, Sunsynk, Deye, Ohme

      **Product:**
      - React + TypeScript dashboard with real-time WebSocket telemetry and Recharts visualisation
      - Supabase authentication and data, Paddle subscription billing, internationalisation
      - iOS and Android applications via Capacitor, with end-to-end Playwright coverage

  - name: Kubernetes Operators Suite
    logo: /images/sections/projects/kubernetes.png
    role: Lead Developer
    timeline: "2022 - Present"
    summary: Custom Kubernetes operators for automating complex application deployments and lifecycle management.
    tags: ["professional"]
    description: |
      Developed multiple production-grade Kubernetes operators including Kafka Connect and KSQL operators
      with custom CRDs and reconciliation loops. These operators automate deployment, configuration, and
      lifecycle management of complex distributed systems.

  - name: Energy Management APIs
    logo: /images/sections/projects/golang.png
    role: Developer
    timeline: "2024 - Present"
    repo: https://github.com/mgazza
    summary: Go client libraries for UK energy platform APIs, enabling smart home automation and battery optimization.
    tags: ["side-project"]
    description: |
      Created Go client libraries (73,000+ lines of code) for integrating with UK energy providers
      including Octopus Energy, GivEnergy, and Solis. Developed SmaliSwagger, an innovative tool for
      reverse-engineering APIs from Android APK files to enable integration where public APIs don't exist.
